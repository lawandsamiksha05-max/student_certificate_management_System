<!DOCTYPE html>
<html>
<head>

    <title>Add Certificate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Add Certificate</h3>

        </div>

        <div class="card-body">

            <form action="/save_certificate" method="POST">

                <div class="mb-3">

                    <label>Student</label>

                    <select name="student_id" class="form-select" required>

                        <option value="">Select Student</option>

                        {% for student in students %}

                        <option value="{{ student[0] }}">
                            {{ student[2] }} ({{ student[1] }})
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>Certificate Type</label>

                    <select name="certificate_type" class="form-select" required>

                        <option>Bonafide Certificate</option>
                        <option>College Leaving Certificate</option>
                        <option>Internship Certificate</option>
                        <option>Scholarship Certificate</option>
                        <option>Course Completion Certificate</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Issue Date</label>

                    <input type="date"
                           name="issue_date"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label>Status</label>

                    <select name="status" class="form-select">

                        <option>Pending</option>
                        <option>Generated</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Remarks</label>

                    <textarea
                        name="remarks"
                        class="form-control"
                        rows="3"></textarea>

                </div>

                <button class="btn btn-success">
                    Save Certificate
                </button>

                <a href="/certificates"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
