<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Department Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(rgba(15,23,42,.55),rgba(37,99,235,.45)),
    url("/static/images/student_bg.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    padding:30px;
}

.container-fluid{
    max-width:1600px;
    margin:auto;
}

/* Toolbar */

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;

    background:rgba(255,255,255,.94);
    padding:20px 28px;
    border-radius:18px;
    margin-bottom:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.toolbar-left h2{
    margin:0;
    color:#1E3A8A;
    font-size:34px;
    font-weight:700;
}

.toolbar-left h2 i{
    color:#3B82F6;
    margin-right:10px;
}

.toolbar-left p{
    margin-top:6px;
    margin-bottom:0;
    color:#1F2937;
    font-size:16px;
    font-weight:500;
}

.btn-back{
    background:#2563EB;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 22px;
    font-weight:600;
}

.btn-back:hover{
    background:#1D4ED8;
    color:#fff;
}

/* Table */

.table-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.table{
    margin:0;
}

.table thead th{
    background:#2563EB !important;
    color:#fff !important;
    border:none;
    padding:12px 16px;
    font-size:14px;
    text-transform:uppercase;
}

.table tbody td{
    padding:10px 16px;
    font-size:15px;
    border-top:1px solid #edf2f7;
    vertical-align:middle;
}

.table tbody tr:nth-child(even){
    background:#F8FAFC;
}

.table tbody tr:hover{
    background:#EAF3FF;
}

@media(max-width:992px){

.toolbar{
    flex-direction:column;
    align-items:flex-start;
}

}

</style>

</head>

<body>

<div class="container-fluid">

<div class="toolbar">

<div class="toolbar-left">

<h2>
<i class="fa-solid fa-building"></i>
Department Report
</h2>

<p>
View all departments and student information.
</p>

</div>

<a href="/reports" class="btn btn-back">
<i class="fa-solid fa-arrow-left"></i>
Back
</a>

</div>

<div class="table-card">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>Department</th>
<th>Total Students</th>

</tr>

</thead>

<tbody>

{% for d in departments %}

<tr>

<td>{{ d[0] }}</td>

<td>{{ d[1] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
