<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:
    linear-gradient(rgba(15,23,42,.55),rgba(37,99,235,.45)),
    url("/static/images/student_bg.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    padding:30px;

}

.container-fluid{
    max-width:1600px;
    margin:auto;
}

/* ================= Toolbar ================= */

.toolbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;

    background:rgba(255,255,255,.94);

    padding:20px 28px;

    border-radius:18px;

    margin-bottom:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.toolbar-left h2{

    color:#1E3A8A;
    font-size:34px;
    font-weight:700;
    margin:0;

}

.toolbar-left h2 i{

    color:#3B82F6;
    margin-right:10px;

}

.toolbar-left p{

    color:#1F2937;
    font-size:16px;
    font-weight:500;
    margin-top:6px;
    margin-bottom:0;

}

/* ================= Buttons ================= */

.btn-primary{

    background:#2563EB;
    border:none;
    border-radius:10px;
    padding:10px 22px;
    font-weight:600;

}

.btn-primary:hover{

    background:#1D4ED8;

}

.btn-secondary{

    border-radius:10px;
    padding:10px 22px;

}

/* ================= Filter Card ================= */

.filter-card{

    background:#fff;

    border-radius:18px;

    padding:25px;

    margin-bottom:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

/* ================= Table ================= */

.table-card{

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 12px 30px rgba(0,0,0,.18);

}

.table{

    margin:0;

}

.table thead th{

    background:#2563EB !important;

    color:#fff !important;

    border:none;

    padding:12px 16px;

    text-transform:uppercase;

}

.table tbody td{

    padding:10px 16px;

    border-top:1px solid #edf2f7;

    vertical-align:middle;

}

.table tbody tr:nth-child(even){

    background:#F8FAFC;

}

.table tbody tr:hover{

    background:#EAF3FF;

}

/* ================= Badge ================= */

.badge{

    font-size:13px;
    padding:8px 14px;
    border-radius:20px;

}

@media(max-width:992px){

.toolbar{

    flex-direction:column;
    align-items:flex-start;

}

}

</style>

</head>

<body>

<div class="container-fluid">

<div class="toolbar">

<div class="toolbar-left">

<h2>

<i class="fa-solid fa-chart-pie"></i>

Status Report

</h2>

<p>

View certificates based on their current status.

</p>

</div>

<a href="/reports" class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

<!-- Filter -->

<div class="filter-card">

<form method="POST">

<div class="row">

<div class="col-md-10">

<label class="form-label fw-bold">

Select Status

</label>

<select name="status" class="form-select">

<option value="Generated">Generated</option>

<option value="Pending">Pending</option>

</select>

</div>

<div class="col-md-2 d-grid">

<label>&nbsp;</label>

<button class="btn btn-primary">

<i class="fa-solid fa-filter"></i>

Filter

</button>

</div>

</div>

</form>

</div>

<!-- Table -->

<div class="table-card">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>ID</th>
<th>Student Name</th>
<th>Certificate Type</th>
<th>Issue Date</th>
<th>Status</th>

</tr>

</thead>

<tbody>

{% for r in reports %}

<tr>

<td>{{ r[0] }}</td>

<td>{{ r[1] }}</td>

<td>{{ r[2] }}</td>

<td>{{ r[3] }}</td>

<td>

{% if r[4] == "Generated" %}

<span class="badge bg-success">

{{ r[4] }}

</span>

{% else %}

<span class="badge bg-warning text-dark">

{{ r[4] }}

</span>

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
