<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* ================= Background ================= */

body{

    background:
        linear-gradient(rgba(15,23,42,.55), rgba(37,99,235,.45)),
        url("/static/images/student_bg.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    padding:30px;

}

/* ================= Container ================= */

.container-fluid{

    max-width:1600px;
    margin:auto;

}

/* ================= Toolbar ================= */

.toolbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;

    background:rgba(255,255,255,.94);

    border-radius:18px;

    padding:20px 28px;

    margin-bottom:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.toolbar-left h2{

    color:#1E3A8A;
    font-size:34px;
    font-weight:700;
    margin:0;

}

.toolbar-left h2 i{

    color:#3B82F6;
    margin-right:12px;

}

.toolbar-left p{

    color:#1F2937;
    font-size:16px;
    font-weight:500;
    margin-top:6px;
    margin-bottom:0;

}

/* ================= Back Button ================= */

.btn-back{

    background:#2563EB;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 20px;
    font-weight:600;

}

.btn-back:hover{

    background:#1D4ED8;
    color:#fff;

}

/* ================= Table Card ================= */

.table-card{

    background:#fff;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 12px 30px rgba(0,0,0,.18);

}

/* ================= Table ================= */

.table{

    margin:0;

}

.table thead th{

    background:#2563EB !important;
    color:#fff !important;

    padding:12px 16px;

    font-size:14px;

    font-weight:700;

    border:none;

    text-transform:uppercase;

}

.table tbody td{

    padding:10px 16px;

    font-size:15px;

    vertical-align:middle;

    border-top:1px solid #edf2f7;

}

.table tbody tr:nth-child(even){

    background:#F8FAFC;

}

.table tbody tr:hover{

    background:#EAF3FF;

    transition:.25s;

}

/* ================= Responsive ================= */

@media(max-width:992px){

.toolbar{

    flex-direction:column;
    align-items:flex-start;

}

}

</style>

</head>

<body>

<div class="container-fluid">

<div class="toolbar">

<div class="toolbar-left">

<h2>

<i class="fa-solid fa-users"></i>

Student Report

</h2>

<p>

View all registered students and their details.

</p>

</div>

<div>

<a href="/reports" class="btn btn-back">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

</div>

<div class="table-card">

<table class="table table-hover align-middle">

<thead>

<tr>

<th>Enrollment No</th>
<th>Student Name</th>
<th>Department</th>
<th>Year</th>
<th>Mobile</th>
<th>Email</th>

</tr>

</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{ s[0] }}</td>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>
<td>{{ s[3] }}</td>
<td>{{ s[4] }}</td>
<td>{{ s[5] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
