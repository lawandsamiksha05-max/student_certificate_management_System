<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Certificate Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="container-fluid">

    <div class="row vh-100">

        <!-- Left Side -->
        <div class="col-lg-6 left-panel d-flex flex-column justify-content-center align-items-center">

            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 class="logo">

            <h1>Student Certificate</h1>

            <h2>Management System</h2>

            <p class="tagline">
                Smart • Secure • Professional
            </p>

            <img src="{{ url_for('static', filename='images/illustration.png') }}"
     class="illustration">

        </div>

        <!-- Right Side -->

        <div class="col-lg-6 d-flex justify-content-center align-items-center">

            <div class="login-card">

                <h2>Welcome Back 👋</h2>

                <p>Please login to continue</p>

               <form action="/login" method="POST">

    <div class="mb-3">
        <label>Username</label>
        <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter Username"
            required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter Password"
            required>
    </div>

    <button type="submit" class="btn login-btn w-100">
        Login
    </button>

</form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
