<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Certificate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning text-dark">

<h3>
<i class="fa-solid fa-pen-to-square"></i>
Edit Certificate
</h3>

</div>

<div class="card-body">

<form action="/update_certificate" method="POST">

<input type="hidden"
       name="certificate_id"
       value="{{ certificate[0] }}">

<div class="mb-3">

<label class="form-label">

Student

</label>

<select name="student_id"
        class="form-select"
        required>

{% for student in students %}

<option value="{{ student[0] }}"
{% if student[0] == certificate[1] %}
selected
{% endif %}
>

{{ student[1] }} ({{ student[2] }})

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Certificate Type

</label>

<select
name="certificate_type"
class="form-select">

<option {% if certificate[2]=='Bonafide Certificate' %}selected{% endif %}>
Bonafide Certificate
</option>

<option {% if certificate[2]=='Leaving Certificate' %}selected{% endif %}>
Leaving Certificate
</option>

<option {% if certificate[2]=='Character Certificate' %}selected{% endif %}>
Character Certificate
</option>

<option {% if certificate[2]=='Internship Certificate' %}selected{% endif %}>
Internship Certificate
</option>

<option {% if certificate[2]=='Scholarship Certificate' %}selected{% endif %}>
Scholarship Certificate
</option>

<option {% if certificate[2]=='Course Completion Certificate' %}selected{% endif %}>
Course Completion Certificate
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Issue Date

</label>

<input
type="date"
name="issue_date"
class="form-control"
value="{{ certificate[3] }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Status

</label>

<select
name="status"
class="form-select">

<option
{% if certificate[4]=='Pending' %}
selected
{% endif %}
>
Pending
</option>

<option
{% if certificate[4]=='Generated' %}
selected
{% endif %}
>
Generated
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Remarks

</label>

<textarea
name="remarks"
class="form-control"
rows="3">{{ certificate[5] }}</textarea>

</div>

<button class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Update Certificate

</button>

<a href="/certificates"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
