<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Edit Student</h3>
        </div>

        <div class="card-body">

            <form action="/update_student" method="POST">

                <input type="hidden" name="student_id" value="{{ student[0] }}">

                <div class="mb-3">
                    <label>Enrollment No</label>
                    <input type="text" class="form-control"
                           name="enrollment_no"
                           value="{{ student[1] }}" required>
                </div>

                <div class="mb-3">
                    <label>Student Name</label>
                    <input type="text" class="form-control"
                           name="student_name"
                           value="{{ student[2] }}" required>
                </div>

                <div class="mb-3">
                    <label>Department</label>
                    <input type="text" class="form-control"
                           name="department"
                           value="{{ student[3] }}" required>
                </div>

                <div class="mb-3">
                    <label>Year</label>
                    <input type="text" class="form-control"
                           name="year"
                           value="{{ student[4] }}" required>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control"
                           name="email"
                           value="{{ student[5] }}" required>
                </div>

                <div class="mb-3">
                    <label>Mobile</label>
                    <input type="text" class="form-control"
                           name="mobile"
                           value="{{ student[6] }}" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Update Student
                </button>

                <a href="/students" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
